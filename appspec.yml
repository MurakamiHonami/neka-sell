version: 0.0
os: linux
files:
  - source: backend/
    destination: /home/ec2-user/app
  - source: scripts/
    destination: /home/ec2-user/app/scripts

hooks:
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: ec2-user
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: ec2-user